<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Escolha de fotos · BGL</title>
<style>:root{--bg:#020B1F;--fg:#EEF2F8;--mut:#A8B5CA;--line:rgba(213,218,225,.18);--acc:#9CC0F0}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 "IBM Plex Sans",system-ui,sans-serif;padding:32px clamp(16px,4vw,48px) 64px}
h1{font:600 clamp(28px,4vw,44px)/1.1 Archivo,Arial,sans-serif;margin:0 0 8px} p.lead{color:var(--mut);max-width:60ch;margin:0 0 40px}
h2{font:600 22px Archivo,Arial,sans-serif;margin:48px 0 16px;padding-top:24px;border-top:1px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
figure{margin:0} img{width:100%;aspect-ratio:3/2;object-fit:cover;display:block;background:#0A2559;filter:saturate(.82) contrast(1.06) brightness(.92)}
figcaption{padding:10px 2px 0;color:var(--mut);font-size:14px;display:flex;gap:10px;align-items:baseline} figcaption b{color:var(--fg);font:600 18px Archivo,Arial,sans-serif;min-width:30px}
.cur{opacity:.55} .cur b{color:var(--mut);font-size:14px}</style></head><body>
<h1>Escolha de fotos</h1><p class="lead">Oito opções para cada tema, já com o tratamento de cor do site. A primeira de cada grupo, mais apagada, é a foto atual. Responda no chat com os códigos escolhidos, por exemplo: E3, N5, R1, P2.</p><section><h2>Elétrica</h2><div class="grid"><figure class="cur"><img src="https://images.unsplash.com/photo-1660330589693-99889d60181e?auto=format&fit=crop&w=900&h=600&q=70" alt="Foto atual" loading="lazy"><figcaption><b>Atual</b>foto em uso hoje</figcaption></figure><figure><img src="https://images.unsplash.com/photo-1621905251189-08b45d6a269e?auto=format&fit=crop&w=900&h=600&q=70" alt="Eletricista com capacete instalando fiação (hoje no topo de “A BGL”)" loading="lazy"><figcaption><b>E1</b>Eletricista com capacete instalando fiação (hoje no topo de “A BGL”)</figcaption></figure><figure><img src="https://images.unsplash.com/photo-1555963966-b7ae5404b6ed?auto=format&fit=crop&w=900&h=600&q=70" alt="Técnico ajustando cabo de aço" loading="lazy"><figcaption><b>E2</b>Técnico ajustando cabo de aço</figcaption></figure><figure><img src="https://images.unsplash.com/photo-1544724569-5f546fd6f2b5?auto=format&fit=crop&w=900&h=600&q=70" alt="Quadro com disjuntores e fiação (hoje no banner do Thermo)" loading="lazy"><figcaption><b>E3</b>Quadro com disjuntores e fiação (hoje no banner do Thermo)</figcaption></figure><figure><img src="https://images.unsplash.com/photo-1597502310092-31cdaa35b46d?auto=format&fit=crop&w=900&h=600&q=70" alt="Eletricista em altura reparando rede aérea" loading="lazy"><figcaption><b>E4</b>Eletricista em altura reparando rede aérea</figcaption></figure><figure><img src="https://images.unsplash.com/photo-1621905251918-48416bd8575a?auto=format&fit=crop&w=900&h=600&q=70" alt="Eletricista de capacete com ferramenta" loading="lazy"><figcaption><b>E5</b>Eletricista de capacete com ferramenta</figcaption></figure><figure><img src="https://images.unsplash.com/photo-1553873002-785d775854c9?auto=format&fit=crop&w=900&h=600&q=70" alt="Alicate amperímetro" loading="lazy"><figcaption><b>E6</b>Alicate amperímetro</figcaption></figure><figure><img src="https://images.unsplash.com/photo-1635335874521-7987db781153?auto=format&fit=crop&w=900&h=600&q=70" alt="Fiação conectada em quadro" loading="lazy"><figcaption><b>E7</b>Fiação conectada em quadro</figcaption></figure><figure><img src="https://images.unsplash.com/photo-1682345262055-8f95f3c513ea?auto=format&fit=crop&w=900&h=600&q=70" alt="Mãos segurando condutores" loading="lazy"><figcaption><b>E8</b>Mãos segurando condutores</figcaption></figure></div></section><section><h2>Condomínios</h2><div class="grid"><figure class="cur"><img src="https://images.unsplash.com/photo-1545324418-cc1a3fa10c00?auto=format&fit=crop&w=900&h=600&q=70" alt="Foto atual" loading="lazy"><figcaption><b>Atual</b>foto em uso hoje</figcaption></figure><figure><img src="https://images.unsplash.com/photo-1580041065738-e72023775cdc?auto=format&fit=crop&w=900&h=600&q=70" alt="Área de lazer com piscina e jardim" loading="lazy"><figcaption><b>N1</b>Área de lazer com piscina e jardim</figcaption></figure><figure><img src="https://images.unsplash.com/photo-1580785692949-7b5b7fd83d25?auto=format&fit=crop&w=900&h=600&q=70" alt="Torres residenciais com palmeiras" loading="lazy"><figcaption><b>N2</b>Torres residenciais com palmeiras</figcaption></figure><figure><img src="https://images.unsplash.com/photo-1629224834618-1cf72b367162?auto=format&fit=crop&w=900&h=600&q=70" alt="Prédio residencial em concreto" loading="lazy"><figcaption><b>N3</b>Prédio residencial em concreto</figcaption></figure><figure><img src="https://images.unsplash.com/photo-1623681153547-64bf22a2e93f?auto=format&fit=crop&w=900&h=600&q=70" alt="Prédio branco sob céu azul" loading="lazy"><figcaption><b>N4</b>Prédio branco sob céu azul</figcaption></figure><figure><img src="https://images.unsplash.com/photo-1690847764792-e9512c1f8056?auto=format&fit=crop&w=900&h=600&q=70" alt="Duas torres lado a lado" loading="lazy"><figcaption><b>N5</b>Duas torres lado a lado</figcaption></figure><figure><img src="https://images.unsplash.com/photo-1624204386084-dd8c05e32226?auto=format&fit=crop&w=900&h=600&q=70" alt="Varandas de vidro ao entardecer" loading="lazy"><figcaption><b>N6</b>Varandas de vidro ao entardecer</figcaption></figure><figure><img src="https://images.unsplash.com/photo-1567684014761-b65e2e59b9eb?auto=format&fit=crop&w=900&h=600&q=70" alt="Fachada de vidro" loading="lazy"><figcaption><b>N7</b>Fachada de vidro</figcaption></figure><figure><img src="https://images.unsplash.com/photo-1725785218870-b41365703511?auto=format&fit=crop&w=900&h=600&q=70" alt="Torre com janelas acesas à noite" loading="lazy"><figcaption><b>N8</b>Torre com janelas acesas à noite</figcaption></figure></div></section><section><h2>Residências</h2><div class="grid"><figure class="cur"><img src="https://images.unsplash.com/photo-1616756405607-590773a1fbf4?auto=format&fit=crop&w=900&h=600&q=70" alt="Foto atual" loading="lazy"><figcaption><b>Atual</b>foto em uso hoje</figcaption></figure><figure><img src="https://images.unsplash.com/photo-1505843513577-22bb7d21e455?auto=format&fit=crop&w=900&h=600&q=70" alt="Casa moderna iluminada à noite" loading="lazy"><figcaption><b>R1</b>Casa moderna iluminada à noite</figcaption></figure><figure><img src="https://images.unsplash.com/photo-1613977257363-707ba9348227?auto=format&fit=crop&w=900&h=600&q=70" alt="Casa branca com piscina" loading="lazy"><figcaption><b>R2</b>Casa branca com piscina</figcaption></figure><figure><img src="https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?auto=format&fit=crop&w=900&h=600&q=70" alt="Casa moderna sob céu azul" loading="lazy"><figcaption><b>R3</b>Casa moderna sob céu azul</figcaption></figure><figure><img src="https://images.unsplash.com/photo-1512917774080-9991f1c4c750?auto=format&fit=crop&w=900&h=600&q=70" alt="Casa branca e cinza junto à piscina" loading="lazy"><figcaption><b>R4</b>Casa branca e cinza junto à piscina</figcapt
