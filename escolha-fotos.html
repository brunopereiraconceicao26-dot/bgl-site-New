<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Escolha de fotos · BGL</title>
<style>:root{--bg:#020B1F;--fg:#EEF2F8;--mut:#A8B5CA;--line:rgba(213,218,225,.18);--acc:#9CC0F0}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 "IBM Plex Sans",system-ui,sans-serif;padding:32px clamp(16px,4vw,48px) 64px}
h1{font:600 clamp(28px,4vw,44px)/1.1 Archivo,Arial,sans-serif;margin:0 0 8px} p.lead{color:var(--mut);max-width:60ch;margin:0 0 40px}
h2{font:600 22px Archivo,Arial,sans-serif;margin:48px 0 16px;padding-top:24px;border-top:1px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
figure{margin:0} img{width:100%;aspect-ratio:3/2;object-fit:cover;display:block;background:#0A2559;filter:saturate(.82) contrast(1.06) brightness(.92)}
figcaption{padding:10px 2px 0;color:var(--mut);font-size:14px;display:flex;gap:10px;align-items:baseline} figcaption b{color:var(--fg);font:600 18px Archivo,Arial,sans-serif;min-width:30px}
.cur{opacity:.55} .cur b{color:var(--mut);font-size:14px}</style></head><body>
<h1>Escolha de fotos</h1><p class="lead">Oito opções para Automação, já com o tratamento de cor do site. A primeira, mais apagada, é a foto atual. Responda no chat com o código escolhido, por exemplo: A3.</p><section><h2>Automação e sistemas inteligentes</h2><div class="grid"><figure class="cur"><img src="https://images.unsplash.com/photo-1558002038-1055907df827?auto=format&fit=crop&w=900&h=600&q=70" alt="Foto atual" loading="lazy"><figcaption><b>Atual</b>foto em uso hoje</figcaption></figure><figure><img src="https://images.unsplash.com/photo-1707733260992-73ff6dbed163?auto=format&fit=crop&w=900&h=600&q=70" alt="Celular controlando o interruptor" loading="lazy"><figcaption><b>A1</b>Celular controlando o interruptor</figcaption></figure><figure><img src="https://images.unsplash.com/photo-1650682009477-52fd77302b78?auto=format&fit=crop&w=900&h=600&q=70" alt="Painel de controle tipo tablet" loading="lazy"><figcaption><b>A2</b>Painel de controle tipo tablet</figcaption></figure><figure><img src="https://images.unsplash.com/photo-1558089687-f282ffcbc126?auto=format&fit=crop&w=900&h=600&q=70" alt="Assistente de voz e caixas de som" loading="lazy"><figcaption><b>A3</b>Assistente de voz e caixas de som</figcaption></figure><figure><img src="https://images.unsplash.com/photo-1545259741-2ea3ebf61fa3?auto=format&fit=crop&w=900&h=600&q=70" alt="Termostato inteligente na parede" loading="lazy"><figcaption><b>A4</b>Termostato inteligente na parede</figcaption></figure><figure><img src="https://images.unsplash.com/photo-1717386255773-a456c611dc4e?auto=format&fit=crop&w=900&h=600&q=70" alt="Painel touchscreen em máquina industrial" loading="lazy"><figcaption><b>A5</b>Painel touchscreen em máquina industrial</figcaption></figure><figure><img src="https://images.unsplash.com/photo-1716191299980-a6e8827ba10b?auto=format&fit=crop&w=900&h=600&q=70" alt="Braço robótico industrial" loading="lazy"><figcaption><b>A6</b>Braço robótico industrial</figcaption></figure><figure><img src="https://images.unsplash.com/photo-1780034766295-43db0f2a0fb7?auto=format&fit=crop&w=900&h=600&q=70" alt="Painel de automação industrial com CLP" loading="lazy"><figcaption><b>A7</b>Painel de automação industrial com CLP</figcaption></figure><figure><img src="https://images.unsplash.com/photo-1753272691001-4d68806ac590?auto=format&fit=crop&w=900&h=600&q=70" alt="Quadro de automação com componentes" loading="lazy"><figcaption><b>A8</b>Quadro de automação com componentes</figcaption></figure></div></section></body></html>
